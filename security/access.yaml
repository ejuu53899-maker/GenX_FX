access_control:
  agents:
    jules:
      role: orchestrator
      permissions: ["read_templates", "request_access", "create_tasks", "audit"]
    cursor:
      role: developer
      permissions: ["read_dev_env", "generate_code", "run_tests"]
    warp:
      role: operator
      permissions: ["execute_commands", "restart_services"]
    copilot:
      role: assistant
      permissions: ["read_public_status"]
